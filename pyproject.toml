[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-telemetry"
version = "0.1.0"
description = "Extensible local agent telemetry receiver and SQLite event store"
requires-python = ">=3.11"

[project.scripts]
agent-telemetry = "agent_telemetry.cli:main"

[project.entry-points."agent_telemetry.adapters"]
codex = "agent_telemetry.codex:CodexAdapter"
claude = "agent_telemetry.claude:ClaudeAdapter"

[tool.setuptools.packages.find]
where = ["src"]
