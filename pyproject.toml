[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-telemetry"
version = "0.2.0"
description = "Read-only query client for the local Collector telemetry store"
requires-python = ">=3.14"

[project.scripts]
agent-telemetry = "agent_telemetry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
