name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test local exporter
        working-directory: exporter
        run: go test ./...
      - name: Build pinned Collector
        run: |
          go install go.opentelemetry.io/collector/cmd/builder@v0.161.0
          cd collector
          "$(go env GOPATH)/bin/builder" --config builder.yaml
      - name: Validate config and run real HTTP integration
        run: |
          python -m pip wheel . -w dist --no-deps
          python -m pip install dist/agent_telemetry-0.2.0-*.whl
          export AGENT_TELEMETRY_COLLECTOR="$PWD/collector/build/agent-telemetry-collector"
          export AGENT_TELEMETRY_DB="$RUNNER_TEMP/telemetry-config-check.sqlite3"
          export AGENT_TELEMETRY_PLATFORM=codex
          "$AGENT_TELEMETRY_COLLECTOR" validate --config=collector/config.yaml
          python -m unittest discover -s tests -v
