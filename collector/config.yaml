# Collector 0.161.0. Set AGENT_TELEMETRY_PLATFORM to codex or claude and
# AGENT_TELEMETRY_DB to an absolute local SQLite path before starting.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
        max_request_body_size: 8388608
        read_timeout: 10s

processors:
  transform/privacy:
    error_mode: propagate
    log_statements:
      - context: log
        statements:
          - set(log.body, "")
          - set(log.severity_text, "")
          - set(log.event_name, "")
          - keep_keys(log.attributes, ["event.name", "event.timestamp", "conversation.id", "session.id", "model", "app.version", "tool_name", "success", "duration_ms", "input_token_count", "output_token_count", "cached_token_count", "cache_write_token_count", "reasoning_token_count", "total_token_count", "input_tokens", "output_tokens", "cache_read_tokens", "cache_creation_tokens"])
          - delete_key(log.attributes, "event.name") where log.attributes["event.name"] != nil and not IsMatch(log.attributes["event.name"], "^(codex\\.(conversation_starts|api_request|sse_event|websocket_request|websocket_event|user_prompt|tool_decision|tool_result)|(?:claude_code\\.)?(user_prompt|api_request|api_error|tool_decision|tool_result))$")
          - keep_keys(log.attributes, []) where log.attributes["event.name"] == nil
      - context: resource
        statements:
          - keep_keys(resource.attributes, ["conversation.id", "session.id", "model", "app.version", "service.name", "service.version"])
          - set(resource.schema_url, "")
      - context: scope
        statements:
          - keep_keys(scope.attributes, [])
          - set(scope.name, "")
          - set(scope.version, "")
          - set(scope.schema_url, "")

exporters:
  agenttelemetry:
    database: ${env:AGENT_TELEMETRY_DB}
    platform: ${env:AGENT_TELEMETRY_PLATFORM}

service:
  telemetry:
    logs:
      level: error
    metrics:
      level: none
  pipelines:
    logs:
      receivers: [otlp]
      processors: [transform/privacy]
      exporters: [agenttelemetry]
